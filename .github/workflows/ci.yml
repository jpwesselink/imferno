name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Security audit
        run: cargo audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Supply-chain policy checks
        run: cargo deny check advisories bans sources

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch MXF test data
        run: ./scripts/fetch-test-data.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace

  test-wasm:
    name: Test WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        working-directory: crates/imferno-wasm
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Generate JSON schemas
        run: cargo xtask generate-schema

      - name: Install test dependencies
        working-directory: crates/imferno-wasm
        run: npm install

      - name: Run WASM tests
        working-directory: crates/imferno-wasm
        run: npx vitest run

  test-napi:
    name: Test NAPI (types contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: crates/imferno-napi
        run: npm install

      - name: Build native module (regenerates index.d.ts)
        working-directory: crates/imferno-napi
        run: npx napi build

      - name: Regenerate types.d.ts from the Rust types
        run: cargo xtask generate-types-ts

      - name: Committed declarations are up to date
        run: |
          git diff --exit-code -- \
            crates/imferno-napi/index.d.ts \
            crates/imferno-napi/types.d.ts \
            crates/imferno-wasm/types.d.ts \
            || { echo "::error::Generated .d.ts files are stale. Run 'npx napi build' in crates/imferno-napi and 'cargo xtask generate-types-ts', then commit."; exit 1; }

      - name: Run NAPI tests
        working-directory: crates/imferno-napi
        run: npx vitest run
