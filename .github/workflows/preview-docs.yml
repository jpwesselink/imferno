name: Preview Docs

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy-preview:
    name: Deploy Preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install

      - name: Build WASM and generate docs
        run: cargo xtask build-docs

      - name: Build Astro site
        working-directory: docs
        env:
          DOCS_VERSION: pr-${{ github.event.pull_request.number }}
        run: pnpm run build

      - name: Deploy to gh-pages
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          REMOTE_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          git clone --depth 1 --branch gh-pages "$REMOTE_URL" gh-pages

          rm -rf "gh-pages/pr-${PR_NUM}"
          cp -r docs/dist "gh-pages/pr-${PR_NUM}"

          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "docs: deploy preview for PR #${PR_NUM}"
          git push

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- docs-preview-comment -->'

      - name: Post or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- docs-preview-comment -->
            **Docs preview** is ready:
            https://jpwesselink.github.io/imferno/pr-${{ github.event.pull_request.number }}/

            _Updated for commit ${{ github.event.pull_request.head.sha }}_

  cleanup-preview:
    name: Cleanup Preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove preview from gh-pages
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          REMOTE_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          git clone --depth 1 --branch gh-pages "$REMOTE_URL" gh-pages
          cd gh-pages

          if [ ! -d "pr-${PR_NUM}" ]; then
            echo "No preview directory to clean up"
            exit 0
          fi

          rm -rf "pr-${PR_NUM}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: remove preview for PR #${PR_NUM}"
          git push

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- docs-preview-comment -->'

      - name: Update comment with removal notice
        if: steps.find-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- docs-preview-comment -->
            ~~**Docs preview** is ready:~~
            ~~https://jpwesselink.github.io/imferno/pr-${{ github.event.pull_request.number }}/~~

            _Preview removed — PR closed._
