name: Publish NAPI Bindings to NPM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0)'
        required: true
        type: string

env:
  NAPI_CRATE: imferno-napi
  NAPI_DIR: crates/imferno-napi

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine version
        id: version
        shell: bash
        run: |
          CARGO_VERSION=$(grep '^version' crates/imferno-core/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH_SLUG=$(echo "${{ github.head_ref }}" | sed 's/[^a-zA-Z0-9.-]/-/g')
            SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
            echo "version=${CARGO_VERSION}-${BRANCH_SLUG}.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "npm-tag=${BRANCH_SLUG}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_VERSION=$(echo "${{ github.event.release.tag_name }}" | sed 's/^.*-v//')
            echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${CARGO_VERSION}-beta.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "npm-tag=beta" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: resolve-version
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'imferno-napi-v') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            use-cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install napi-rs CLI
        run: npm install -g @napi-rs/cli

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Build native module
        working-directory: ${{ env.NAPI_DIR }}
        shell: bash
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            napi build --release --target ${{ matrix.target }} --platform --use-cross
          else
            napi build --release --target ${{ matrix.target }} --platform
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: ${{ env.NAPI_DIR }}/imferno-node.*.node
          if-no-files-found: error

  publish:
    name: Publish to NPM
    needs: [resolve-version, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install napi-rs CLI
        run: npm install -g @napi-rs/cli

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.NAPI_DIR }}/artifacts
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: ls -lR ${{ env.NAPI_DIR }}/artifacts/

      - name: Distribute binaries to npm packages
        working-directory: ${{ env.NAPI_DIR }}
        run: napi artifacts --output-dir artifacts --npm-dir npm

      - name: Set version
        working-directory: ${{ env.NAPI_DIR }}
        shell: bash
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          # Update meta-package version + optionalDependencies
          node -e "
            const pkg = require('./package.json');
            pkg.version = '$VERSION';
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = '$VERSION';
            }
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Update all platform package versions
          for dir in npm/*/; do
            if [ -f "$dir/package.json" ]; then
              cd "$dir"
              npm version --no-git-tag-version --allow-same-version "$VERSION"
              cd ../..
            fi
          done

      - name: Copy LICENSE
        run: cp LICENSE ${{ env.NAPI_DIR }}/LICENSE

      - name: Publish platform packages
        working-directory: ${{ env.NAPI_DIR }}
        shell: bash
        run: |
          for dir in npm/*/; do
            if [ -f "$dir/imferno-node.*.node" ] 2>/dev/null || ls "$dir"/*.node 1>/dev/null 2>&1; then
              echo "Publishing $dir..."
              cd "$dir"
              npm publish --tag ${{ needs.resolve-version.outputs.npm-tag }} || echo "Warning: failed to publish $dir"
              cd ../..
            else
              echo "Skipping $dir (no .node binary)"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish meta-package
        working-directory: ${{ env.NAPI_DIR }}
        run: npm publish --tag ${{ needs.resolve-version.outputs.npm-tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
