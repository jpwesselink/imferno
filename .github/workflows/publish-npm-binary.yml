name: Publish Native Binaries to NPM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine version
        id: version
        shell: bash
        run: |
          CARGO_VERSION=$(grep '^version' crates/imferno-core/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          NEXT_PATCH=$(echo "$CARGO_VERSION" | awk -F. '{print $1"."$2"."$3+1}')
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH_SLUG=$(echo "${{ github.head_ref }}" | sed 's/[^a-zA-Z0-9.-]/-/g')
            SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
            echo "version=${NEXT_PATCH}-${BRANCH_SLUG}.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "npm-tag=${BRANCH_SLUG}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_VERSION=$(echo "${{ github.event.release.tag_name }}" | sed 's/^.*-v//')
            echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${NEXT_PATCH}-beta.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "npm-tag=beta" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.npm_pkg }}
    needs: resolve-version
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'imferno-v') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            npm_pkg: imferno-linux-x64-gnu
            binary: imferno
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            npm_pkg: imferno-linux-arm64-gnu
            binary: imferno
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            npm_pkg: imferno-darwin-x64
            binary: imferno
          - target: aarch64-apple-darwin
            runner: macos-14
            npm_pkg: imferno-darwin-arm64
            binary: imferno
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            npm_pkg: imferno-win32-x64-msvc
            binary: imferno.exe
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            npm_pkg: imferno-win32-arm64-msvc
            binary: imferno.exe
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p imferno
          else
            cargo build --release --target ${{ matrix.target }} -p imferno
          fi

      - name: Copy binary into npm package
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} crates/imferno/npm/${{ matrix.npm_pkg }}/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Set npm version
        working-directory: crates/imferno/npm/${{ matrix.npm_pkg }}
        shell: bash
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Publish platform package
        working-directory: crates/imferno/npm/${{ matrix.npm_pkg }}
        run: npm publish --access public --tag ${{ needs.resolve-version.outputs.npm-tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-meta:
    name: Publish meta-package
    needs: [resolve-version, build]
    if: ${{ always() && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Set version
        working-directory: crates/imferno/npm/imferno
        shell: bash
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          node -e "
            const pkg = require('./package.json');
            pkg.version = '$VERSION';
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = '$VERSION';
            }
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Wait for platform packages on npm
        shell: bash
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          for pkg in @imferno/darwin-arm64 @imferno/darwin-x64 @imferno/linux-x64-gnu @imferno/linux-arm64-gnu; do
            echo "Waiting for ${pkg}@${VERSION}..."
            for i in $(seq 1 30); do
              if npm view "${pkg}@${VERSION}" version 2>/dev/null; then
                echo "  ✓ ${pkg}@${VERSION} available"
                break
              fi
              sleep 10
            done
          done

      - name: Copy LICENSE
        run: cp LICENSE crates/imferno/npm/imferno/LICENSE

      - name: Publish meta-package
        working-directory: crates/imferno/npm/imferno
        run: npm publish --access public --tag ${{ needs.resolve-version.outputs.npm-tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
