name: Publish to NPM

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 2.0.0)'
        required: true

jobs:
  resolve-version:
    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'imferno-wasm-v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          CARGO_VERSION=$(grep '^version' crates/imferno-core/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH_SLUG=$(echo "$HEAD_REF" | sed 's/[^a-zA-Z0-9.-]/-/g')
            SHORT_SHA=$(echo "$PR_HEAD_SHA" | cut -c1-7)
            echo "version=${CARGO_VERSION}-${BRANCH_SLUG}.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "npm-tag=${BRANCH_SLUG}" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "release" ]; then
            RELEASE_VERSION=$(echo "$RELEASE_TAG" | sed 's/^.*-v//')
            echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ]; then
            echo "version=${CARGO_VERSION}-beta.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "npm-tag=beta" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=${DISPATCH_VERSION}" >> "$GITHUB_OUTPUT"
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build and publish WASM to NPM
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        working-directory: crates/imferno-wasm
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Generate JSON schemas
        run: cargo xtask generate-schema

      - name: Install test dependencies
        working-directory: crates/imferno-wasm
        run: npm install

      - name: Run WASM tests
        working-directory: crates/imferno-wasm
        run: npx vitest run

      - name: Update package version
        working-directory: crates/imferno-wasm
        env:
          RESOLVED_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          echo "Setting npm version to: $RESOLVED_VERSION"
          npm version --no-git-tag-version --allow-same-version "$RESOLVED_VERSION"

      - name: Publish to NPM
        if: github.event_name != 'pull_request'
        working-directory: crates/imferno-wasm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ needs.resolve-version.outputs.npm-tag }}
        run: npm publish --tag "$NPM_TAG"
