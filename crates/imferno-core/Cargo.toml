[package]
name = "imferno-core"
version = "3.0.0"
edition = "2021"
description = "SMPTE ST 2067 IMF parser and validator"
license = "MIT"
authors = ["JP Wesselink <jpwesselink@gmail.com>"]
repository = "https://github.com/jpwesselink/imferno"
readme = "README.md"

[features]
default = []
wasm       = ["dep:tsify", "dep:wasm-bindgen"]
typescript = ["dep:ts-rs"]
xmlsec1    = ["dep:tempfile"]
jsonschema = ["dep:schemars"]
tokio = ["dep:tokio"]
aws-s3 = ["dep:aws-sdk-s3", "dep:aws-config", "tokio"]

[dependencies]
serde        = { workspace = true, features = ["derive"] }
serde_json   = { workspace = true }
quick-xml    = { workspace = true, features = ["serialize"] }
uuid         = { workspace = true, features = ["serde"] }
thiserror    = { workspace = true }
regex        = { workspace = true }
sha1         = { workspace = true }
sha2         = { workspace = true }
base64       = { workspace = true }
chrono       = { workspace = true }
url          = { workspace = true }
strum        = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
ts-rs        = { version = "9.0",  optional = true }
tsify        = { version = "0.4",  optional = true }
tempfile     = { workspace = true, optional = true }
schemars     = { version = "0.8", optional = true }
xmlsec       = { version = "0.3.0", optional = true }
libxml       = { version = "0.3.8", optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"], optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
uppsala    = { version = "0.4" }
# MXF essence-header parsing — pure-Rust port of the SMPTE-reference
# regxmllib, verified semantically identical to the Java implementation
# across 75 real-world IMF MXFs. Drives the SMPTE essence-rule checks
# under `crate::mxf::essence`. Native targets only — MXF binaries don't
# reach the wasm validator (browser callers upload XML, not full assets),
# so we keep the wasm bundle lean by excluding these from that target.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
smpte-mxf = { version = "0.1" }
smpte-klv = { version = "0.1" }
smpte-types = { version = "0.1" }
# Full MXF header metadata parsing (Preface, MaterialPackage,
# AudioChannelLabelSubDescriptor, …) — converts an MXF file into
# RegXML so the audio MCA / IMSC profile / IAB params rules can be
# applied against typed metadata. Same native-only constraint as
# the partition-pack layer above.
regxml = { version = "0.1" }
regxml-dict = { version = "0.1" }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile          = { workspace = true }
xmloxide          = "0.4"

[[example]]
name = "xsd_validate_spike"
path = "examples/xsd_validate_spike.rs"

[[example]]
name = "xsd_validate_spike_uppsala"
path = "examples/xsd_validate_spike_uppsala.rs"
