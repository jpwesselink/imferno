[package]
name = "imferno-napi"
version = "3.0.0"
edition = "2021"
description = "Native Node.js bindings for the imferno SMPTE ST 2067 IMF validator"
license = "MIT"
repository = "https://github.com/jpwesselink/imferno"
publish = false

[features]
default = []
aws-s3 = ["imferno-core/aws-s3"]

[lib]
crate-type = ["cdylib"]

[dependencies]
imferno-core = { path = "../imferno-core", version = "3.1.0", features = ["uppsala-patched"] }
napi = { version = "3", default-features = false, features = ["napi9", "serde-json"] }
# Exact: napi-derive emits the type definitions that become index.d.ts, and
# CI fails if the committed index.d.ts is stale (Cargo.lock is not committed).
napi-derive = "=3.7.0"
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }

[build-dependencies]
napi-build = "2"
