[package]
name = "imferno"
version = "3.0.1"
edition = "2021"
description = "Command-line interface for SMPTE ST 2067 IMF packages"
license = "MIT"
authors = ["JP Wesselink <jpwesselink@gmail.com>"]
repository = "https://github.com/jpwesselink/imferno"
readme = "README.md"

[[bin]]
name = "imferno"
path = "src/main.rs"

[features]
default = []
aws-s3 = ["imferno-core/aws-s3", "dep:aws-config", "dep:aws-sdk-s3"]

[dependencies]
# `uppsala-patched` is intentionally NOT enabled here even though it provides
# richer per-element XSD codes locally. Reason: `cargo publish --verify` for
# this crate resolves `imferno-core` from crates.io (NOT the workspace path),
# and the published `imferno-core` depends on vanilla uppsala 0.4 — turning
# on `uppsala-patched` against that combination fails to compile because the
# patch's `element_path` field doesn't exist. Workspace test runs still get
# the patched-uppsala behaviour because imferno-napi / imferno-wasm /
# benchmarks / corpus-tests (all `publish = false`) enable the feature, and
# cargo unifies features across the workspace graph.
imferno-core = { path = "../imferno-core", version = "3.0.1", features = ["tokio"] }
clap = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
comfy-table = "7.1"
chromakopia = "0.1.0"
aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
