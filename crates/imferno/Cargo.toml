[package]
name = "imferno"
version = "2.1.2"
edition = "2021"
description = "Command-line interface for SMPTE ST 2067 IMF packages"
license = "MIT"
authors = ["JP Wesselink <jpwesselink@gmail.com>"]
repository = "https://github.com/jpwesselink/imferno"
readme = "README.md"

[[bin]]
name = "imferno"
path = "src/main.rs"

[features]
default = []
aws-s3 = ["imferno-core/aws-s3", "dep:aws-config", "dep:aws-sdk-s3"]

[dependencies]
imferno-core = { path = "../imferno-core", version = "2.1.2", features = ["tokio"] }
clap = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
comfy-table = "7.1"
chromakopia = "0.1.0"
aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
