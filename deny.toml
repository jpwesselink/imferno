[graph]
all-features = false
# Internal crates that aren't published don't need version pinning
exclude = ["corpus-tests", "imf-benchmarks", "xtask"]

[advisories]
version = 2
# quick-xml 0.37.5 is pulled transitively via regxml 0.1.1 / regxml-dict
# 0.1.1 (our own published crates). imferno-core's own quick-xml is 0.41
# (advisory-clean). Mirror of the ignores in .cargo/audit.toml — see the
# risk assessment there. Remove both once regxml/regxml-dict 0.1.2 ship
# with quick-xml >= 0.41.
ignore = [
    "RUSTSEC-2026-0194", # quick-xml 0.37 — quadratic dup-attribute check
    "RUSTSEC-2026-0195", # quick-xml 0.37 — unbounded xmlns allocation
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# `uppsala` is patched onto our `imferno-patches` fork — see the
# top-level Cargo.toml's `[patch.crates-io]` block. Tracks
# v0.4.0 plus two imferno-only fixes (element_path on
# ValidationError + xmlns-aware QName resolution).
allow-git = ["https://github.com/jpwesselink/uppsala"]
