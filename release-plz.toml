[workspace]
# Only bump versions based on conventional commits.
# release-plz opens a Release PR; merging it triggers a crates.io publish.
#
# Disable cargo-semver-checks: breaking changes often affect the WASM/JS API
# (not the Rust API), so conventional commits (feat!) must drive major bumps.
semver_check = false

[[package]]
name = "imferno-core"
# Published to crates.io

[[package]]
name = "imferno"
# Published to crates.io (the CLI binary)

[[package]]
name = "imferno-wasm"
# Built from Rust, published to npm — NOT to crates.io.
publish = false

[[package]]
name = "imferno-napi"
# Built from Rust, published to npm — NOT to crates.io.
publish = false
