[package]
name = "uppsala-source-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Spike: uppsala as the lossless source layer for imferno"

# Standalone: not a member of the imferno workspace.
[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
uppsala = "0.12"
imferno-core = { path = "../../crates/imferno-core", features = ["uppsala-patched"] }
quick-xml = { version = "0.42", features = ["serialize"] }
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
proptest = "1"

# Same fork as the imferno workspace, on the `attr-ranges` branch
# (imferno-patches-0.12 + Document::attribute_spans / attribute_range).
[patch.crates-io]
uppsala = { git = "https://github.com/jpwesselink/uppsala", rev = "695962e103b5663fab2ef35e86ea77527ae0a475" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
